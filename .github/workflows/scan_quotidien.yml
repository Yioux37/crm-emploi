name: Veille emploi quotidienne

on:
  schedule:
    - cron: '30 6 * * *'   # 06:30 UTC (07:30 en hiver a Paris)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: emploi-public-feed
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      INDEX_MAX_QUERIES: "20"
      NEWS_MAX_QUERIES: "5"
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer les dependances
        run: pip install -r requirements.txt
      - name: Mettre a jour uniquement les annonces publiques
        run: python scraper.py --output offres_detectees.csv --report scan_rapport.json --signals-output signaux_marche.csv
      - name: Committer le flux sans les donnees CRM personnelles
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add offres_detectees.csv signaux_marche.csv scan_rapport.json
          if ! git diff --cached --quiet; then
            git commit -m "Veille quotidienne: annonces publiques"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
