name: Veille emploi quotidienne

on:
  # schedule:
    # - cron: '30 6 * * *'   # 06:30 UTC (07:30 en hiver a Paris)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: emploi-public-feed
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      INDEX_MAX_QUERIES: "60"
      NEWS_MAX_QUERIES: "5"
      # Sans cette ligne, le secret GitHub n'est jamais transmis au script :
      # le scan retombe sur DDGS, bloque depuis les IP GitHub Actions.
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      # Alertes emploi LinkedIn lues dans Gmail (lecture seule). Facultatif :
      # sans ces secrets, la source est simplement marquee "desactive".
      IMAP_USER: ${{ secrets.IMAP_USER }}
      IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          # Toujours le dernier commit de la branche, meme sur un "Re-run jobs"
          # (sinon GitHub reprend le commit du run d'origine, parfois vieux de plusieurs heures).
          ref: ${{ github.ref_name }}
      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer les dependances
        run: pip install -r requirements.txt
      - name: Mettre a jour uniquement les annonces publiques
        run: python scraper.py --output offres_detectees.csv --report scan_rapport.json --signals-output signaux_marche.csv
      - name: Diagnostic du scan (telechargeable)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-radar
          path: scan_rapport.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Committer le flux sans les donnees CRM personnelles
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          FICHIERS="offres_detectees.csv signaux_marche.csv scan_rapport.json"
          # 1. On met de cote le resultat du scan.
          mkdir -p /tmp/scan && cp $FICHIERS /tmp/scan/
          # 2. On se cale sur la branche a jour (y compris un scan pousse depuis le Mac pendant ce run).
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
          # 3. On remet le scan par-dessus : fichiers generes, le plus recent fait foi.
          #    Pas de rebase, donc pas de conflit possible sur ces fichiers.
          cp /tmp/scan/* .
          git add $FICHIERS
          if ! git diff --cached --quiet; then
            git commit -m "Veille quotidienne: annonces publiques"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
